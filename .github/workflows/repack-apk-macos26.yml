name: Repack APK on macOS 26

on:
  workflow_dispatch:

jobs:
  repack-apk:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run apk.py
        run: |
          python apk.py

      - name: Collect repacked APK
        run: |
          mkdir -p artifacts
          find . -type f -name '*.apk' -exec cp {} artifacts/ \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: repacked-apk-macos-26
          path: artifacts/*.apk
          if-no-files-found: error
